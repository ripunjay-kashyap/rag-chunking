[project]
name = "rag-chunking"
version = "0.1.0"
description = "Fixed-size vs structure-aware chunking comparison for RAG"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.28.0",
    "numpy>=2.4.6",
    "openai>=3.24.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_chunking"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
